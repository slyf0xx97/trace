<style>
:root{--ground:#eef4f9;--ink:#152331;--slate:#3f5570;--blue:#3a6ea5;--blue-ink:#2b5a87;--blue-soft:#e4eef8;--muted:#52606f;--z:1;--fit:1}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--ground);-webkit-text-size-adjust:100%}
body{font-family:"DM Sans",system-ui,sans-serif;color:var(--ink);overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
img{display:block;-webkit-user-drag:none;user-select:none}
#app{width:402px;margin:0 auto;zoom:var(--z);background:var(--ground);min-height:calc(100vh / var(--z));position:relative;overflow:hidden}
.view{position:relative;width:402px;background:var(--ground)}
.view.in{animation:fadein .2s ease both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.view>img.base{position:absolute;left:0;top:0;width:402px}
.view>img.base.swap{animation:fadein .25s ease both}
.hdr{position:absolute;left:20px;top:52px;width:362px;height:40px;display:flex;align-items:center;justify-content:space-between;z-index:3;pointer-events:none}
.pill{display:flex;align-items:center;background:rgba(255,255,255,.88);border-radius:999px;white-space:nowrap;font-weight:600;color:var(--ink)}
.pill.logo{height:40px;gap:8px;padding:0 14px 0 10px;box-shadow:0 4px 12px rgba(21,35,49,.12)}
.pill.logo img{width:26px;height:22px}.pill.logo span{font-family:Outfit;font-weight:700;font-size:18px}
.pill.back{height:40px;gap:6px;padding:0 14px 0 10px;font-size:14px;box-shadow:0 4px 12px rgba(21,35,49,.12)}
.pill.back img{width:18px;height:18px}
.pill.where{padding:8px 12px;font-size:13px}
.hot{position:absolute;z-index:4;border-radius:10px;cursor:pointer}
.hot:active{background:rgba(21,35,49,.07)}
.debug .hot{outline:2px dashed #d23e1b;outline-offset:-2px;background:rgba(210,62,27,.08)}
.debug .w{outline:2px dashed #417f4c;outline-offset:1px}

/* ---------- interactive widgets (states drawn from the Figma components) ---------- */
.w{position:absolute;z-index:5;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;white-space:nowrap;cursor:pointer;
   transition:background-color .2s,border-color .2s,color .2s;user-select:none}
.w.ghost{background:transparent}
.w.chip{font-family:"DM Sans";font-weight:600;font-size:13px;border:1.5px solid #d9dde3;background:#fff;color:var(--ink)}
.w.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.w.tog{background:#c9d3dd;justify-content:flex-start;padding:0 3px}
.w.tog i{width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(21,35,49,.2);transition:transform .2s ease}
.w.tog.on{background:#417f4c}.w.tog.on i{transform:translateX(18px)}
.w.act{font-family:Outfit;font-weight:600;font-size:13px;background:#e4eef8;border:1px solid #bfd3e8;box-shadow:0 2px 0 #c9daea;color:var(--blue-ink)}
.w.act.done,.w.sp.done{background:#e5f1df;border-color:#e5f1df;box-shadow:none;color:#347241}
.w.join{font-family:Outfit;font-weight:600;font-size:14px;background:var(--blue);border:1px solid #bfd3e8;box-shadow:0 2px 0 #c9daea;color:#fff}
.w.join.done{background:#417f4c;border-color:#417f4c;box-shadow:none}
.w.sp{font-family:Outfit;font-weight:600;font-size:15px;border-radius:14px}
.w.ghost.chip,.w.ghost.tog,.w.ghost.act,.w.ghost.join,.w.ghost.sp{background:transparent!important;border-color:transparent!important;box-shadow:none!important;color:transparent!important}
.w.ghost i,.w.ghost svg{opacity:0}
.w.compact{background:#fff;border-radius:0;box-shadow:0 3px 0 #fff;justify-content:flex-end}   /* hides the baked Connect button on the white card */
.cbadge{display:flex;align-items:center;justify-content:center;gap:4px;width:90px;height:22px;border-radius:999px;background:#e5f1df;color:#347241;font-family:Outfit;font-weight:600;font-size:12px;animation:fadein .2s ease both}
.w,.hot{outline:none}
.w:focus-visible,.hot:focus-visible{outline:2px solid #3a6ea5;outline-offset:2px}

/* ---------- bottom nav (same as the A/B app) ---------- */
#navwrap{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none}
#nav{width:402px;margin:0 auto;zoom:var(--z);height:75px;position:relative}
.nav{position:absolute;left:0;right:0;bottom:0;height:75px;background:#fff;border-top:1px solid #e3e9ef;border-radius:28px 28px 0 0;display:flex;align-items:flex-start;padding:0 8px 18px;pointer-events:auto}
.tab{flex:1;height:100%;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0 6px;border-radius:14px;color:var(--muted);font-size:11px;font-weight:500}
.tab .ico{width:22px;height:22px;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.tab.on{background:var(--blue-soft);color:var(--blue-ink);font-weight:600}

/* ---------- overlays ---------- */
#ovl{position:fixed;inset:0;z-index:30;display:none}
#ovl.open{display:block}
.scrim{position:absolute;inset:0;background:rgba(21,35,49,.4);animation:fadein .2s ease both}
.sheetwrap{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none}
.sheetbox{position:relative;width:402px;zoom:var(--z);overflow:hidden;pointer-events:auto;animation:sheetup .28s cubic-bezier(.2,.8,.2,1) both}
@keyframes sheetup{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}
.sheetbox>img{position:absolute;left:0;top:0;width:402px}

/* ================= DESKTOP: phone frame + control bar ================= */
#bar,#status,#homebar{display:none}
html.framed,html.framed body{background:radial-gradient(1200px 700px at 50% -10%,#24384d 0%,#111b26 55%,#0b121a 100%) fixed;min-height:100vh}
html.framed #stage{display:flex;flex-direction:column;align-items:center;gap:18px;padding:16px 16px 28px}
html.framed #bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;color:#e8eef5;width:100%;max-width:1180px}
.grp{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:6px}
.brand{gap:10px;padding:6px 14px 6px 8px}
.brand .mk{width:34px;height:34px;border-radius:10px;background:#eef4f9;display:flex;align-items:center;justify-content:center}
.brand .mk img{width:22px;height:19px}
.brand b{font-family:Outfit;font-size:16px;font-weight:700;color:#fff}
.brand .tag{font-size:11px;font-weight:700;color:#ffd9cf;background:rgba(210,62,27,.28);border:1px solid rgba(210,62,27,.55);border-radius:999px;padding:2px 8px;margin-left:6px}
.brand small{display:block;font-size:11.5px;color:#9fb0c2;margin-top:1px}
.lbl{font-size:10.5px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:#8095aa;padding:0 6px 0 8px}
.bb{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:#d7e1ec;padding:7px 12px;border-radius:11px;white-space:nowrap;text-decoration:none}
.bb:hover{background:rgba(255,255,255,.07)}
.bb.on{background:#eef4f9;color:#152331}
.bb.go{background:#3a6ea5;color:#fff}
.bb svg{width:15px;height:15px}
#pick{font:600 13px "DM Sans";color:#152331;background:#eef4f9;border:0;border-radius:11px;padding:7px 10px;max-width:230px}
html.framed #phone{zoom:var(--fit);width:426px;height:898px;padding:12px;border-radius:66px;background:linear-gradient(145deg,#3a4250,#15191f 40%,#2a3039);box-shadow:0 0 0 2px #0a0d11,0 30px 80px rgba(0,0,0,.55),inset 0 0 0 2px rgba(255,255,255,.08)}
html.framed #screen{position:relative;width:402px;height:874px;border-radius:54px;overflow:hidden;background:var(--ground);isolation:isolate}
html.framed #scroller{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;overscroll-behavior:contain}
html.framed #scroller::-webkit-scrollbar{display:none}
html.framed #app{min-height:874px}
html.framed #navwrap,html.framed #ovl{position:absolute}
html.framed #status{display:flex;position:absolute;left:0;right:0;top:0;height:50px;z-index:35;align-items:center;justify-content:space-between;padding:4px 34px 0 40px;font-weight:700;font-size:15px;color:#152331;pointer-events:none}
#status .isl{position:absolute;left:50%;top:11px;width:124px;height:36px;margin-left:-62px;background:#000;border-radius:20px}
#status .ic{display:flex;gap:6px;align-items:center}
html.framed #homebar{display:block;position:absolute;left:50%;bottom:7px;width:136px;height:5px;margin-left:-68px;border-radius:3px;background:#152331;opacity:.85;z-index:35;pointer-events:none}
</style>

</head>
